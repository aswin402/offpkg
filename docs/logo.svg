<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="100%" height="100%">
  <defs>
    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap');

      text {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .mono {
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      /* Gentle floating animation */
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      .floating {
        animation: float 5s ease-in-out infinite;
        transform-origin: 130px 130px;
      }

      /* Glow pulses */
      @keyframes neon-pulse {
        0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 4px #00f2fe); }
        50% { opacity: 1.0; filter: drop-shadow(0 0 12px #00f2fe); }
      }
      .pulse-cyan {
        animation: neon-pulse 3.5s ease-in-out infinite;
      }

      /* Subtle orbit rotation */
      @keyframes orbit {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .orbital-ring {
        transform-origin: 130px 130px;
        animation: orbit 24s linear infinite;
      }

      /* Wi-Fi wave pulse */
      @keyframes wave {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1.0; }
      }
      .wave-1 { animation: wave 2.4s ease-in-out infinite; }
      .wave-2 { animation: wave 2.4s ease-in-out infinite 0.4s; }
      .wave-3 { animation: wave 2.4s ease-in-out infinite 0.8s; }
    </style>

    <!-- Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="box-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="box-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0.98" />
    </linearGradient>

    <linearGradient id="box-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0.98" />
    </linearGradient>

    <linearGradient id="badge-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filters -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- LEFT: ICON GROUP -->
  <g transform="translate(10, 0)">
    <!-- Ambient Orbital Caching Ring -->
    <g class="orbital-ring" opacity="0.35">
      <ellipse cx="130" cy="130" rx="105" ry="60" fill="none" stroke="url(#cyan-glow)" stroke-width="1.5" stroke-dasharray="6 8" />
      <circle cx="235" cy="130" r="4.5" fill="#00f2fe" filter="url(#soft-glow)" />
      <circle cx="25" cy="130" r="3.5" fill="#818cf8" />
    </g>

    <!-- Floating Isometric Package -->
    <g class="floating">
      <!-- Cube Top Face -->
      <polygon points="130,48 198,87 130,126 62,87" fill="url(#box-top)" stroke="#00f2fe" stroke-width="1.8" />
      
      <!-- Cube Left Face -->
      <polygon points="62,87 130,126 130,205 62,166" fill="url(#box-left)" stroke="#00f2fe" stroke-width="2.2" class="pulse-cyan" />
      
      <!-- Cube Right Face -->
      <polygon points="130,126 198,87 198,166 130,205" fill="url(#box-right)" stroke="#818cf8" stroke-width="2" />
      
      <!-- Center Seam Accent -->
      <line x1="130" y1="126" x2="130" y2="205" stroke="#334155" stroke-width="1.5" />

      <!-- Top Flap details (Isometric Fold) -->
      <polygon points="62,87 130,126 100,75 32,36" fill="#1e1b4b" stroke="#00f2fe" stroke-width="1.5" opacity="0.85" />
      <polygon points="130,126 198,87 228,36 160,75" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" opacity="0.85" />

      <!-- Offline Signal / Lightning Mark on Left Face -->
      <g transform="matrix(0.866, 0.5, 0, 1, 64, 87)">
        <!-- Wi-Fi Arcs -->
        <circle cx="15" cy="62" r="3.5" fill="#00f2fe" class="wave-1" />
        <path d="M 15 45 A 17 17 0 0 1 32 62" fill="none" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" class="wave-2" />
        <path d="M 15 28 A 34 34 0 0 1 49 62" fill="none" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" class="wave-3" />
        
        <!-- Diagonal Slash Line (Offline state) -->
        <line x1="5" y1="68" x2="58" y2="12" stroke="#ff385c" stroke-width="4.5" stroke-linecap="round" />
        <line x1="5" y1="68" x2="58" y2="12" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.9" />
      </g>

      <!-- Storage / Database Lines on Right Face -->
      <g transform="matrix(0.866, -0.5, 0, 1, 130, 126)">
        <path d="M 12,24 L 38,24 L 52,38" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" opacity="0.8" />
        <circle cx="52" cy="38" r="2.5" fill="#c084fc" />
        
        <path d="M 18,52 L 44,52 L 56,40" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" opacity="0.8" />
        <circle cx="56" cy="40" r="2.5" fill="#c084fc" />
      </g>
    </g>
  </g>

  <!-- RIGHT: WORDMARK & TAGLINE -->
  <g transform="translate(260, 42)">
    <!-- Brand Name "offpkg" -->
    <text x="0" y="74" font-size="76" font-weight="900" letter-spacing="-2">
      <tspan fill="url(#cyan-glow)" filter="url(#soft-glow)">off</tspan>
      <tspan fill="#ffffff">pkg</tspan>
    </text>

    <!-- Version badge inline -->
    <rect x="255" y="24" width="62" height="24" rx="12" fill="#00f2fe" fill-opacity="0.12" stroke="#00f2fe" stroke-width="1.2" />
    <text x="286" y="40" font-size="11" font-weight="700" fill="#00f2fe" text-anchor="middle" class="mono">v0.1.7</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="114" font-size="13.5" font-weight="700" letter-spacing="3.2" fill="#94a3b8" class="mono">
      UNIVERSAL OFFLINE PACKAGE MANAGER
    </text>

    <!-- Secondary Value Statement -->
    <text x="0" y="142" font-size="14.5" font-weight="600" fill="#cbd5e1" opacity="0.9">
      Cache once online. Build, link &amp; scaffold full projects offline forever.
    </text>

    <!-- Tech Stack Pill Badges -->
    <g transform="translate(0, 168)">
      <!-- Rust Pill -->
      <g>
        <rect x="0" y="0" width="86" height="26" rx="6" fill="#1e293b" stroke="#e05d44" stroke-width="1" />
        <circle cx="12" cy="13" r="3.5" fill="#e05d44" />
        <text x="24" y="17" font-size="11" font-weight="600" fill="#f8fafc" class="mono">Rust</text>
      </g>

      <!-- Bun Pill -->
      <g transform="translate(94, 0)">
        <rect x="0" y="0" width="84" height="26" rx="6" fill="#1e293b" stroke="#fb923c" stroke-width="1" />
        <circle cx="12" cy="13" r="3.5" fill="#fb923c" />
        <text x="24" y="17" font-size="11" font-weight="600" fill="#f8fafc" class="mono">Bun</text>
      </g>

      <!-- uv Pill -->
      <g transform="translate(186, 0)">
        <rect x="0" y="0" width="76" height="26" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1" />
        <circle cx="12" cy="13" r="3.5" fill="#a855f7" />
        <text x="24" y="17" font-size="11" font-weight="600" fill="#f8fafc" class="mono">uv</text>
      </g>

      <!-- Flutter Pill -->
      <g transform="translate(270, 0)">
        <rect x="0" y="0" width="102" height="26" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
        <circle cx="12" cy="13" r="3.5" fill="#38bdf8" />
        <text x="24" y="17" font-size="11" font-weight="600" fill="#f8fafc" class="mono">Flutter</text>
      </g>

      <!-- SQLite Pill -->
      <g transform="translate(380, 0)">
        <rect x="0" y="0" width="98" height="26" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1" />
        <circle cx="12" cy="13" r="3.5" fill="#10b981" />
        <text x="24" y="17" font-size="11" font-weight="600" fill="#f8fafc" class="mono">SQLite</text>
      </g>
    </g>
  </g>
</svg>
