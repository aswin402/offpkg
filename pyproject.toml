[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "offpkg"
version = "0.1.7"
description = "Universal offline package manager for Bun (npm), Python uv (PyPI), and Flutter (pub.dev)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Aswin" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]

[project.scripts]
offpkg = "offpkg_cli:main"

[tool.setuptools]
py-modules = ["offpkg_cli"]
